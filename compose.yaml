services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DAYMARK_MODE: cloud
      DAYMARK_DATA_DIR: /app/data
      DAYMARK_PUBLIC_ORIGIN: https://${DAYMARK_DOMAIN:?Set DAYMARK_DOMAIN}
      DAYMARK_ENCRYPTION_KEY: ${DAYMARK_ENCRYPTION_KEY:?Generate an encryption key}
      DAYMARK_INVITE_CODE: ${DAYMARK_INVITE_CODE:?Generate an invitation code}
      DAYMARK_MAX_USERS: ${DAYMARK_MAX_USERS:-100}
    volumes:
      - daymark_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  proxy:
    image: caddy:2-alpine
    environment:
      DAYMARK_DOMAIN: ${DAYMARK_DOMAIN:?Set DAYMARK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  daymark_data:
  caddy_data:
  caddy_config:
